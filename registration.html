<!DOCTYPE html>
<html>
<head>
<script src="validate.js"></script>
<link rel="stylesheet" href="style.css">
<title>Registration</title>
</head>
<body bgcolor="#FFFFFF">

<h2 align="center">Registration Form</h2>

<form name="regform" method="post" action="#" onsubmit="return validateForm()">
<table align="center" border="0" cellpadding="8">
    <tr>
        <td align="right">Name:</td>
        <td><input type="text" name="fullname" size="30"></td>
    </tr>
    <tr>
        <td align="right">Password:</td>
        <td><input type="password" name="password" size="30"></td>
    </tr>
    <tr>
        <td align="right">Email:</td>
        <td><input type="text" name="email" size="30"></td>
    </tr>
    <tr>
        <td align="right">Phone No:</td>
        <td><input type="text" name="mobile" size="30"></td>
    </tr>
    <tr>
        <td align="right">Sex :</td>
        <td>
            <input type="radio" name="gender" value="male"> Male
            <input type="radio" name="gender" value="female"> Female
            <input type="radio" name="gender" value="other"> Other
        </td>
    </tr>
    <tr>
        <td align="right">Date of Birth:</td>
        <td><input type="date" name="dob"></td>

    </tr>
    <tr>
        <td align="right">Language Known :</td>
        <td>
            <input type="checkbox" name="language" value="english"> English
            <input type="checkbox" name="language" value="hindi"> Hindi
            <input type="checkbox" name="language" value="urdu"> Urdu
            <input type="checkbox" name="language" value="other"> Other
        </td>
    </tr>
    <tr>
        <td align="right">Address:</td>
        <td><textarea name="address" rows="5" cols="30"></textarea></td>
    </tr>
    <tr>
        <td colspan="2" align="center">
            <input type="submit" value="Submit">
            &nbsp;
            <input type="reset" value="Reset">
        </td>
    </tr>
</table>
</form>

</body>
</html>
